<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-labelledby="title desc"><title id="title">椭圆：到两个焦点的距离之和固定</title><desc id="desc">两个焦点位于横轴，椭圆上一点到焦点的两段距离以赭色显示。</desc><rect width="760" height="405" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">椭圆：到两个焦点的距离之和固定</text><line x1="105" y1="205" x2="655" y2="205" stroke="#c9c7ba" stroke-width="2"/><line x1="380" y1="342.5" x2="380" y2="67.5" stroke="#c9c7ba" stroke-width="2"/><text x="668.75" y="205" font-size="17" fill="#354744" text-anchor="middle">x</text><text x="393.75" y="67.5" font-size="17" fill="#354744" text-anchor="middle">y</text><text x="367" y="225" font-size="15" fill="#354744" text-anchor="middle">0</text><ellipse cx="380" cy="205" rx="220" ry="132" fill="none" stroke="#46686b" stroke-width="2.5"/><line x1="204.0" y1="205" x2="380" y2="73.0" stroke="#a46449" stroke-width="2"/><line x1="556.0" y1="205" x2="380" y2="73.0" stroke="#a46449" stroke-width="2"/><circle cx="204.0" cy="205" r="4" fill="#a46449" stroke="#a46449" stroke-width="2"/><circle cx="556.0" cy="205" r="4" fill="#a46449" stroke="#a46449" stroke-width="2"/><text x="204.0" y="230" font-size="18" fill="#354744" text-anchor="middle">F₁</text><text x="556.0" y="230" font-size="18" fill="#354744" text-anchor="middle">F₂</text><text x="410" y="93.0" font-size="18" fill="#354744" text-anchor="middle">P</text><text x="380" y="376" font-size="18" fill="#354744" text-anchor="middle">PF₁ + PF₂ = 2a；焦点在内部，顶点在椭圆上。</text></g></svg>