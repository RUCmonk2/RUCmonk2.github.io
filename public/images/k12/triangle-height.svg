<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">高必须垂直于所选的底</title><desc id="desc">三角形顶点到底边作垂线，标出直角；斜边不充当这条底的高。</desc><rect width="760" height="340" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">高必须垂直于所选的底</text><polygon points="120,250 600,250 300,80" fill="#46686b" fill-opacity="0.15" stroke="#46686b" stroke-width="2"/><line x1="300" y1="80" x2="300" y2="250" stroke="#a46449" stroke-width="2" stroke-dasharray="6 5"/><line x1="300" y1="230" x2="320" y2="230" stroke="#a46449" stroke-width="2"/><line x1="320" y1="230" x2="320" y2="250" stroke="#a46449" stroke-width="2"/><text x="370" y="283" font-size="20" fill="#354744" text-anchor="middle">底 b</text><text x="323" y="172" font-size="20" fill="#a46449" text-anchor="start">高 h</text><text x="380" y="316" font-size="18" fill="#354744" text-anchor="middle">同底等高的三角形，面积都是底 × 高 ÷ 2。</text></g></svg>