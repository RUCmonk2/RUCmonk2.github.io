<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">先确定角，再判断对边与邻边</title><desc id="desc">右侧为直角，左端为研究角，底边是邻边，竖边是对边，上方斜边最长。</desc><rect width="760" height="340" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">先确定角，再判断对边与邻边</text><polygon points="150,245 600,245 600,90" fill="#46686b" fill-opacity="0.15" stroke="#46686b" stroke-width="2"/><line x1="580" y1="245" x2="580" y2="225" stroke="#354744" stroke-width="2"/><line x1="580" y1="225" x2="600" y2="225" stroke="#354744" stroke-width="2"/><path d="M 207 245 A 57 57 0 0 0 204 226" fill="none" stroke="#a46449" stroke-width="2"/><text x="223" y="232" font-size="23" fill="#a46449" text-anchor="middle">θ</text><text x="382" y="278" font-size="20" fill="#354744" text-anchor="middle">邻边</text><text x="624" y="171" font-size="20" fill="#354744" text-anchor="middle">对边</text><text x="365" y="150" font-size="20" fill="#354744" text-anchor="middle">斜边</text><text x="380" y="321" font-size="18" fill="#354744" text-anchor="middle">相对角 θ：sin = 对边 / 斜边；cos = 邻边 / 斜边。</text></g></svg>