<svg xmlns="http://www.w3.org/2000/svg" width="760" height="525" viewBox="0 0 760 525" role="img" aria-labelledby="title desc"><title id="title">勾股定理：把边长变成面积</title><desc id="desc">三四五直角三角形的三边外作正方形，面积九与十六之和为二十五。</desc><rect width="760" height="525" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">勾股定理：把边长变成面积</text><g transform="translate(15 85)"><polygon points="290,250 410,250 290,90" fill="#354744" fill-opacity="0.06" stroke="#354744" stroke-width="2"/><polygon points="290,250 410,250 410,370 290,370" fill="#a46449" fill-opacity="0.18" stroke="#a46449" stroke-width="2"/><polygon points="290,250 290,90 130,90 130,250" fill="#46686b" fill-opacity="0.18" stroke="#46686b" stroke-width="2"/><polygon points="410,250 290,90 450,-30 570,130" fill="#46686b" fill-opacity="0.07" stroke="#46686b" stroke-width="2"/><text x="350" y="312" font-size="21" fill="#a46449" text-anchor="middle">3² = 9</text><text x="210" y="175" font-size="21" fill="#46686b" text-anchor="middle">4² = 16</text><text x="450" y="164" font-size="21" fill="#46686b" text-anchor="middle">5² = 25</text><line x1="290" y1="230" x2="310" y2="230" stroke="#354744" stroke-width="2"/><line x1="310" y1="230" x2="310" y2="250" stroke="#354744" stroke-width="2"/></g><text x="380" y="492" font-size="18" fill="#354744" text-anchor="middle">9 + 16 = 25：比较的是三条边上的正方形面积。</text></g></svg>