<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title desc"><title id="title">单位圆：把角与坐标连接起来</title><desc id="desc">第一象限点P连接原点，水平投影表示余弦，竖直坐标表示正弦。</desc><rect width="760" height="395" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">单位圆：把角与坐标连接起来</text><circle cx="270" cy="200" r="115" fill="none" stroke="#354744" stroke-width="2"/><line x1="125" y1="200" x2="415" y2="200" stroke="#c9c7ba" stroke-width="2"/><line x1="270" y1="65" x2="270" y2="332" stroke="#c9c7ba" stroke-width="2"/><path d="M 306 200 A 36 36 0 0 0 291.6 171.2" fill="none" stroke="#a46449" stroke-width="2"/><text x="316" y="184" font-size="20" fill="#a46449" text-anchor="middle">θ</text><line x1="270" y1="200" x2="339.0" y2="108.0" stroke="#46686b" stroke-width="2"/><line x1="339.0" y1="108.0" x2="339.0" y2="200" stroke="#a46449" stroke-width="2" stroke-dasharray="6 5"/><circle cx="339.0" cy="108.0" r="4" fill="#a46449" stroke="#a46449" stroke-width="2"/><text x="398" y="100" font-size="20" fill="#46686b" text-anchor="middle">P = (cos θ, sin θ)</text><text x="309" y="225" font-size="18" fill="#354744" text-anchor="middle">cos θ</text><text x="398" y="155" font-size="18" fill="#a46449" text-anchor="middle">sin θ</text><text x="241" y="222" font-size="18" fill="#354744" text-anchor="middle">O</text><text x="535" y="235" font-size="22" fill="#354744" text-anchor="middle">半径 = 1</text><text x="380" y="363" font-size="18" fill="#354744" text-anchor="middle">三角函数是圆上点的坐标，角可以超过 90°。</text></g></svg>