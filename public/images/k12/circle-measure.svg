<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">圆的一维长度与二维面积</title><desc id="desc">圆中标注半径与直径，右侧分别给出周长和面积。</desc><rect width="760" height="340" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">圆的一维长度与二维面积</text><circle cx="230" cy="177" r="100" fill="none" stroke="#354744" stroke-width="2"/><line x1="230" y1="177" x2="330" y2="177" stroke="#a46449" stroke-width="2"/><line x1="130" y1="177" x2="330" y2="177" stroke="#46686b" stroke-width="2" stroke-dasharray="6 5"/><circle cx="230" cy="177" r="3" fill="#354744" stroke="#354744" stroke-width="2"/><text x="265" y="160" font-size="22" fill="#a46449" text-anchor="middle">r</text><text x="230" y="204" font-size="18" fill="#354744" text-anchor="middle">直径 d = 2r</text><text x="545" y="140" font-size="26" fill="#46686b" text-anchor="middle">周长：2πr</text><text x="545" y="206" font-size="26" fill="#a46449" text-anchor="middle">面积：πr²</text><text x="380" y="314" font-size="17" fill="#354744" text-anchor="middle">半径变为原来的 2 倍：周长变为 2 倍，面积变为 4 倍。</text></g></svg>