<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">平行四边形剪拼成长方形</title><desc id="desc">左侧三角形平移到右侧空缺处，成为底乘高的矩形，斜边不是高。</desc><rect width="760" height="340" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">平行四边形剪拼成长方形</text><polygon points="60,240 260,240 320,110 120,110" fill="#46686b" fill-opacity="0.15" stroke="#46686b" stroke-width="2"/><polygon points="60,240 120,240 120,110" fill="#a46449" fill-opacity="0.2" stroke="#a46449" stroke-width="2"/><line x1="120" y1="110" x2="120" y2="240" stroke="#a46449" stroke-width="2" stroke-dasharray="6 5"/><line x1="350" y1="180" x2="410" y2="180" stroke="#a46449" stroke-width="2"/><polygon points="402,175 410,180 402,185" fill="#a46449" fill-opacity="1" stroke="#a46449" stroke-width="2"/><text x="380" y="160" font-size="17" fill="#a46449" text-anchor="middle">剪拼</text><rect x="450" y="110" width="200" height="130" fill="#46686b" fill-opacity="0.12" stroke="#46686b" stroke-width="1.5"/><polygon points="590,240 650,240 650,110" fill="#a46449" fill-opacity="0.2" stroke="#a46449" stroke-width="2"/><text x="190" y="273" font-size="20" fill="#354744" text-anchor="middle">底 b</text><text x="550" y="273" font-size="20" fill="#354744" text-anchor="middle">长 b</text><text x="675" y="179" font-size="18" fill="#a46449" text-anchor="middle">高 h</text><text x="380" y="318" font-size="17" fill="#354744" text-anchor="middle">左块平移到右侧，面积不变；长方形的长 = 底，宽 = 高。</text></g></svg>