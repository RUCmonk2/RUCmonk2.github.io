<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc"><title id="title">位置有方向，距离没有正负</title><desc id="desc">数轴从负四到四，负三与正三到原点距离均为三。</desc><rect width="760" height="300" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">位置有方向，距离没有正负</text><line x1="65" y1="160" x2="695" y2="160" stroke="#354744" stroke-width="2"/><line x1="100" y1="154" x2="100" y2="166" stroke="#354744" stroke-width="2"/><text x="100" y="193" font-size="17" fill="#354744" text-anchor="middle">-4</text><line x1="170" y1="154" x2="170" y2="166" stroke="#354744" stroke-width="2"/><text x="170" y="193" font-size="17" fill="#354744" text-anchor="middle">-3</text><line x1="240" y1="154" x2="240" y2="166" stroke="#354744" stroke-width="2"/><text x="240" y="193" font-size="17" fill="#354744" text-anchor="middle">-2</text><line x1="310" y1="154" x2="310" y2="166" stroke="#354744" stroke-width="2"/><text x="310" y="193" font-size="17" fill="#354744" text-anchor="middle">-1</text><line x1="380" y1="154" x2="380" y2="166" stroke="#354744" stroke-width="2"/><text x="380" y="193" font-size="17" fill="#354744" text-anchor="middle">0</text><line x1="450" y1="154" x2="450" y2="166" stroke="#354744" stroke-width="2"/><text x="450" y="193" font-size="17" fill="#354744" text-anchor="middle">1</text><line x1="520" y1="154" x2="520" y2="166" stroke="#354744" stroke-width="2"/><text x="520" y="193" font-size="17" fill="#354744" text-anchor="middle">2</text><line x1="590" y1="154" x2="590" y2="166" stroke="#354744" stroke-width="2"/><text x="590" y="193" font-size="17" fill="#354744" text-anchor="middle">3</text><line x1="660" y1="154" x2="660" y2="166" stroke="#354744" stroke-width="2"/><text x="660" y="193" font-size="17" fill="#354744" text-anchor="middle">4</text><line x1="170" y1="124" x2="380" y2="124" stroke="#a46449" stroke-width="2"/><line x1="380" y1="124" x2="590" y2="124" stroke="#46686b" stroke-width="2"/><circle cx="170" cy="160" r="5" fill="#a46449" stroke="#a46449" stroke-width="2"/><circle cx="590" cy="160" r="5" fill="#46686b" stroke="#46686b" stroke-width="2"/><text x="270" y="105" font-size="19" fill="#a46449" text-anchor="middle">距离 3</text><text x="485" y="105" font-size="19" fill="#46686b" text-anchor="middle">距离 3</text><text x="380" y="255" font-size="19" fill="#354744" text-anchor="middle">−3 与 3 互为相反数，到 0 的距离都为 3。</text></g></svg>