<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">同底等高，体积相差三倍</title><desc id="desc">圆柱与圆锥底半径和垂直高度相同，圆锥体积为圆柱的三分之一。</desc><rect width="760" height="380" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">同底等高，体积相差三倍</text><ellipse cx="160" cy="245" rx="85" ry="23" fill="#46686b" fill-opacity=".13" stroke="#46686b" stroke-width="2"/><ellipse cx="160" cy="90" rx="85" ry="23" fill="none" stroke="#46686b" stroke-width="2"/><line x1="75" y1="90" x2="75" y2="245" stroke="#46686b" stroke-width="2"/><line x1="245" y1="90" x2="245" y2="245" stroke="#46686b" stroke-width="2"/><line x1="160" y1="90" x2="160" y2="245" stroke="#a46449" stroke-width="2" stroke-dasharray="6 5"/><line x1="160" y1="245" x2="245" y2="245" stroke="#a46449" stroke-width="2"/><text x="175" y="165" font-size="21" fill="#a46449" text-anchor="middle">h</text><text x="202" y="235" font-size="21" fill="#a46449" text-anchor="middle">r</text><text x="160" y="295" font-size="23" fill="#354744" text-anchor="middle">圆柱：πr²h</text><ellipse cx="535" cy="245" rx="85" ry="23" fill="#46686b" fill-opacity=".13" stroke="#46686b" stroke-width="2"/><line x1="535" y1="90" x2="450" y2="245" stroke="#46686b" stroke-width="2"/><line x1="535" y1="90" x2="620" y2="245" stroke="#46686b" stroke-width="2"/><line x1="535" y1="90" x2="535" y2="245" stroke="#a46449" stroke-width="2" stroke-dasharray="6 5"/><line x1="535" y1="245" x2="620" y2="245" stroke="#a46449" stroke-width="2"/><text x="550" y="165" font-size="21" fill="#a46449" text-anchor="middle">h</text><text x="577" y="235" font-size="21" fill="#a46449" text-anchor="middle">r</text><text x="535" y="295" font-size="23" fill="#354744" text-anchor="middle">圆锥：πr²h / 3</text><text x="380" y="348" font-size="18" fill="#354744" text-anchor="middle">同底等高的比较；高与母线不同。</text></g></svg