<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">分配律是同一块面积的两种计算</title><desc id="desc">两组二乘三方格合为四乘三矩形，共十二格。</desc><rect width="760" height="340" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">分配律是同一块面积的两种计算</text><rect x="80" y="85" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="120" y="85" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="160" y="85" width="40" height="40" fill="#46686b" fill-opacity="0.06" stroke="#46686b" stroke-width="1.5"/><rect x="200" y="85" width="40" height="40" fill="#46686b" fill-opacity="0.06" stroke="#46686b" stroke-width="1.5"/><rect x="80" y="125" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="120" y="125" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="160" y="125" width="40" height="40" fill="#46686b" fill-opacity="0.06" stroke="#46686b" stroke-width="1.5"/><rect x="200" y="125" width="40" height="40" fill="#46686b" fill-opacity="0.06" stroke="#46686b" stroke-width="1.5"/><rect x="80" y="165" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="120" y="165" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="160" y="165" width="40" height="40" fill="#46686b" fill-opacity="0.06" stroke="#46686b" stroke-width="1.5"/><rect x="200" y="165" width="40" height="40" fill="#46686b" fill-opacity="0.06" stroke="#46686b" stroke-width="1.5"/><text x="160" y="246" font-size="20" fill="#354744" text-anchor="middle">2 × 3 + 2 × 3</text><text x="355" y="158" font-size="30" fill="#354744" text-anchor="middle">=</text><rect x="450" y="85" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="490" y="85" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="530" y="85" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="570" y="85" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="450" y="125" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="490" y="125" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="530" y="125" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="570" y="125" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="450" y="165" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="490" y="165" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="530" y="165" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><rect x="570" y="165" width="40" height="40" fill="#46686b" fill-opacity="0.23" stroke="#46686b" stroke-width="1.5"/><text x="530" y="246" font-size="20" fill="#354744" text-anchor="middle">(2 + 2) × 3</text><text x="380" y="302" font-size="18" fill="#354744" text-anchor="middle">先分成两块数，再合起来数，总量保持不变。</text></g></svg>