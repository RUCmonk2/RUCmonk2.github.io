<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">把斜向的变化分解出指定方向的部分</title><desc id="desc">向量a从原点向右上方，其水平投影在b方向上，垂线把终点与投影终点连接。</desc><rect width="760" height="380" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">把斜向的变化分解出指定方向的部分</text><line x1="110" y1="260" x2="600" y2="260" stroke="#c9c7ba" stroke-width="2"/><line x1="170" y1="295" x2="170" y2="70" stroke="#c9c7ba" stroke-width="2"/><line x1="170" y1="260" x2="540" y2="110" stroke="#46686b" stroke-width="3"/><line x1="170" y1="260" x2="540" y2="260" stroke="#a46449" stroke-width="3"/><line x1="540" y1="110" x2="540" y2="260" stroke="#c9c7ba" stroke-width="2" stroke-dasharray="6 5"/><text x="365" y="155" font-size="23" fill="#46686b" text-anchor="middle">向量 a</text><text x="360" y="291" font-size="20" fill="#a46449" text-anchor="middle">沿 b 方向的投影</text><text x="615" y="266" font-size="18" fill="#354744" text-anchor="middle">b 方向</text><text x="380" y="345" font-size="18" fill="#354744" text-anchor="middle">a · b = |a| |b| cos θ；数量积的结果是一个数。</text></g></svg>