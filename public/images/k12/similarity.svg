<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">相似放大：长度和面积的倍率不同</title><desc id="desc">小直角三角形底三高二，大三角形底六高四，边长加倍而面积四倍。</desc><rect width="760" height="340" rx="6" fill="#f7f5ed"/><g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="34" font-size="19" fill="#354744" text-anchor="start">相似放大：长度和面积的倍率不同</text><polygon points="100,245 220,245 100,165" fill="#46686b" fill-opacity="0.15" stroke="#46686b" stroke-width="2"/><polygon points="405,245 645,245 405,85" fill="#a46449" fill-opacity="0.14" stroke="#a46449" stroke-width="2"/><text x="160" y="276" font-size="21" fill="#354744" text-anchor="middle">3</text><text x="83" y="212" font-size="21" fill="#354744" text-anchor="middle">2</text><text x="525" y="276" font-size="21" fill="#a46449" text-anchor="middle">6</text><text x="385" y="172" font-size="21" fill="#a46449" text-anchor="middle">4</text><text x="380" y="317" font-size="20" fill="#354744" text-anchor="middle">长度比 1 : 2，面积比 1 : 4。</text></g></svg>