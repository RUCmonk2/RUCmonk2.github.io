<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">同一末端位姿的两支逆解</title><desc id="desc">左图关节角为零、九十度、零；右图为九十度、负九十度、九十度。两图腕点均为一、一，末端为一、一点五，方向竖直向上。</desc><rect width="1000" height="520" rx="12" fill="#fffefb"/><g font-family="system-ui, sans-serif" fill="#28352f"><text x="40" y="45" font-size="24" font-weight="600">同一目标，两种构型</text><text x="40" y="77" font-size="15" fill="#66736a">L₁ = L₂ = 1 m，L₃ = 0.5 m · 关节角逆时针为正</text><text x="60" y="120" font-size="20" font-weight="600">解 A　(0°, 90°, 0°)</text><path d="M100 151V405H415.0" stroke="#bcc4ba" fill="none"/><path d="M275 405V172.5M100 250H275" stroke="#d4dace" stroke-dasharray="5 5" fill="none"/><path d="M100 405L275 405" stroke="#3d6c57" stroke-width="8" stroke-linecap="round"/><path d="M275 405L275 250" stroke="#3d6c57" stroke-width="8" stroke-linecap="round"/><path d="M275 250L275 172.5" stroke="#b6813f" stroke-width="8" stroke-linecap="round"/><circle cx="100" cy="405" r="7" stroke="#3d6c57" stroke-width="2" fill="#fffefb"/><circle cx="275" cy="405" r="7" stroke="#3d6c57" stroke-width="2" fill="#fffefb"/><circle cx="275" cy="250" r="7" stroke="#3d6c57" stroke-width="2" fill="#fffefb"/><circle cx="275" cy="172.5" r="7" stroke="#3d6c57" stroke-width="2" fill="#fffefb"/><text x="62" y="430" font-size="15">O (0, 0)</text><text x="290" y="255" font-size="15">W (1, 1)</text><text x="290" y="177.5" font-size="15">E (1, 1.5)</text><text x="420.0" y="410" font-size="16">x</text><text x="94" y="142" font-size="16">y</text><text x="540" y="120" font-size="20" font-weight="600">解 B　(90°, −90°, 90°)</text><path d="M580 151V405H895.0" stroke="#bcc4ba" fill="none"/><path d="M755 405V172.5M580 250H755" stroke="#d4dace" stroke-dasharray="5 5" fill="none"/><path d="M580 405L580 250" stroke="#3d6c57" stroke-width="8" stroke-linecap="round"/><path d="M580 250L755 250" stroke="#3d6c57" stroke-width="8" stroke-linecap="round"/><path d="M755 250L755 172.5" stroke="#b6813f" stroke-width="8" stroke-linecap="round"/><circle cx="580" cy="405" r="7" stroke="#3d6c57" stroke-width="2" fill="#fffefb"/><circle cx="580" cy="250" r="7" stroke="#3d6c57" stroke-width="2" fill="#fffefb"/><circle cx="755" cy="250" r="7" stroke="#3d6c57" stroke-width="2" fill="#fffefb"/><circle cx="755" cy="172.5" r="7" stroke="#3d6c57" stroke-width="2" fill="#fffefb"/><text x="542" y="430" font-size="15">O (0, 0)</text><text x="770" y="255" font-size="15">W (1, 1)</text><text x="770" y="177.5" font-size="15">E (1, 1.5)</text><text x="900.0" y="410" font-size="16">x</text><text x="574" y="142" font-size="16">y</text><text x="40" y="488" font-size="16" fill="#66736a">末端都朝上；不同的是肘部的位置。每一支解都要代回正运动学检查。</text></g></svg>