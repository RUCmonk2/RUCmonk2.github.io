<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">训练与验证误差示意</title><desc id="desc">训练误差持续降低，验证误差先下降再上升；虚线为验证误差最低附近，仅作示意并非实测数据。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536d66"/></marker></defs><rect width="960" height="420" rx="14" fill="#faf8f2"/><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#263e37}.title{font-size:24px;font-weight:600}.label{font-size:19px}.small{font-size:16px}.node{fill:#fff;stroke:#456c60;stroke-width:2}.edge{fill:none;stroke:#536d66;stroke-width:2;marker-end:url(#arrow)}.axis{stroke:#aab4af;stroke-width:1.5}.curve{fill:none;stroke-width:3}</style><text x="40" y="40" class="title">训练更久，验证表现未必更好</text><line x1="95" y1="335" x2="885" y2="335" class="axis"/><line x1="95" y1="335" x2="95" y2="80" class="axis"/><text x="38" y="90" class="label">误差</text><text x="780" y="367" class="label">训练进程 →</text><path d="M110 115 C200 210 300 275 460 295 S730 320 865 322" class="curve" stroke="#256f61"/><path d="M110 105 C220 190 290 250 460 260 S685 205 865 145" class="curve" stroke="#b05e3e"/><line x1="500" y1="85" x2="500" y2="335" stroke="#9c9273" stroke-dasharray="7 6" stroke-width="2"/><text x="515" y="99" class="label">依据验证集选择停止时刻</text><text x="735" y="132" class="label" style="fill:#b05e3e">验证误差</text><text x="735" y="300" class="label" style="fill:#256f61">训练误差</text><text x="40" y="404" class="small">自绘概念图，依据 W2 第17–22、49页；无数值刻度，不代表实验数据。</text></svg>