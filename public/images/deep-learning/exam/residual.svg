<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">残差块：两条路径共同影响输出</title><desc id="desc">BasicBlock常用两个3×3；Bottleneck常用1×1 → 3×3 → 1×1</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#264c53"/></marker></defs><rect width="1000" height="480" rx="12" fill="#faf7ef"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="38" y="45" text-anchor="start" fill="#264c53" font-size="30" font-weight="600">残差块：两条路径共同影响输出</text><text x="38" y="80" text-anchor="start" fill="#5f6c6a" font-size="18" font-weight="400">BasicBlock常用两个3×3；Bottleneck常用1×1 → 3×3 → 1×1</text><rect x="50" y="215" width="120" height="70" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="110.0" y="258.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">x</text><path d="M170,250 L250,250" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="270" y="215" width="270" height="70" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="405.0" y="258.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">残差分支 F(x)</text><path d="M540,250 L700,250" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="735" cy="250" r="24" fill="#faf7ef" stroke="#a15d38" stroke-width="2.5"/><text x="735" y="258" text-anchor="middle" fill="#a15d38" font-size="27" font-weight="400">+</text><path d="M760,250 L830,250" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="840" y="215" width="110" height="70" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="895.0" y="258.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">y</text><path d="M215,250 L215,140 L735,140 L735,223" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><text x="475" y="123" text-anchor="middle" fill="#264c53" font-size="23" font-weight="400">恒等捷径：直接传 x</text><text x="500" y="355" text-anchor="middle" fill="#a15d38" font-size="30" font-weight="400">y = x + F(x)</text><text x="500" y="400" text-anchor="middle" fill="#5f6c6a" font-size="23" font-weight="400">相加要求形状一致；不同形状时可用投影 P x</text><text x="500" y="445" text-anchor="middle" fill="#5f6c6a" font-size="19" font-weight="400">本图不含加法之后的激活；若有激活，反向还需乘其导数</text></g></svg>