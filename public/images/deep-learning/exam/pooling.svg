<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">池化：保留显著值，或汇总平均值</title><desc id="desc">先自己算两种输出；空间尺寸改变，通道数保持不变</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#264c53"/></marker></defs><rect width="1000" height="480" rx="12" fill="#faf7ef"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="38" y="45" text-anchor="start" fill="#264c53" font-size="30" font-weight="600">池化：保留显著值，或汇总平均值</text><text x="38" y="80" text-anchor="start" fill="#5f6c6a" font-size="18" font-weight="400">先自己算两种输出；空间尺寸改变，通道数保持不变</text><rect x="95" y="170" width="75" height="75" fill="#faf7ef" stroke="#bdccc5"/><text x="132.5" y="215.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">4</text><rect x="170" y="170" width="75" height="75" fill="#faf7ef" stroke="#bdccc5"/><text x="207.5" y="215.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">1</text><rect x="95" y="245" width="75" height="75" fill="#faf7ef" stroke="#bdccc5"/><text x="132.5" y="290.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">2</text><rect x="170" y="245" width="75" height="75" fill="#faf7ef" stroke="#bdccc5"/><text x="207.5" y="290.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">3</text><text x="170" y="350" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">一个通道的窗口</text><path d="M270,245 L350,245 L350,175 L465,175" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M350,245 L350,315 L465,315" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="480" y="135" width="240" height="80" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="600.0" y="183.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">最大池化：max</text><rec