<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">卷积窗口：局部连接，权值共享</title><desc id="desc">互相关 · 步长1 · 无填充 · 无偏置 · 输入值仅用于展示窗口</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#264c53"/></marker></defs><rect width="1000" height="480" rx="12" fill="#faf7ef"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="38" y="45" text-anchor="start" fill="#264c53" font-size="30" font-weight="600">卷积窗口：局部连接，权值共享</text><text x="38" y="80" text-anchor="start" fill="#5f6c6a" font-size="18" font-weight="400">互相关 · 步长1 · 无填充 · 无偏置 · 输入值仅用于展示窗口</text><rect x="65" y="140" width="65" height="65" fill="#e8efeb" stroke="#bdccc5"/><text x="97.5" y="180.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">1</text><rect x="130" y="140" width="65" height="65" fill="#e8efeb" stroke="#bdccc5"/><text x="162.5" y="180.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">2</text><rect x="195" y="140" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="227.5" y="180.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">3</text><rect x="65" y="205" width="65" height="65" fill="#e8efeb" stroke="#bdccc5"/><text x="97.5" y="245.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">4</text><rect x="130" y="205" width="65" height="65" fill="#e8efeb" stroke="#bdccc5"/><text x="162.5" y="245.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">5</text><rect x="195" y="205" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="227.5" y="245.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">6</text><rect x="65" y="270" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="97.5" y="310.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">7</text><rect x="130" y="270" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="162.5" y="310.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">8</text><rect x="195" y="270" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="227.5" y="310.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">9</text><text x="160" y="365" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">输入 X：3 × 3</text><rect x="390" y="165" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="422.5" y="205.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">a</text><rect x="455" y="165" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="487.5" y="205.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">b</text><rect x="390" y="230" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="422.5" y="270.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">c</text><rect x="455" y="230" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="487.5" y="270.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">d</text><text x="455" y="320" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">共享核 K：2 × 2</text><rect x="730" y="165" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="762.5" y="205.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">z₀₀</text><rect x="795" y="165" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="827.5" y="205.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">z₀₁</text><rect x="730" y="230" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="762.5" y="270.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">z₁₀</text><rect x="795" y="230" width="65" height="65" fill="#faf7ef" stroke="#bdccc5"/><text x="827.5" y="270.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">z₁₁</text><text x="795" y="320" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">输出 Z：2 × 2</text><path d="M280,230 L365,230" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M545,230 L695,230" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><text x="620" y="210" text-anchor="middle" fill="#264c53" font-size="20" font-weight="400">乘积求和</text><text x="500" y="410" text-anchor="middle" fill="#a15d38" font-size="25" font-weight="400">z₀₀ = a·1 + b·2 + c·4 + d·5</text><text x="500" y="450" text-anchor="middle" fill="#5f6c6a" font-size="20" font-weight="400">核不翻转；向右、向下滑动时，a、b、c、d保持不变</text></g></svg>