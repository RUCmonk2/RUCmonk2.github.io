<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">六权重BP计算网络</title><desc id="desc">两输入两隐藏一输出，无偏置、无非线性；w1至w6标注在连接上。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536d66"/></marker></defs><rect width="960" height="420" rx="14" fill="#faf8f2"/><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#263e37}.title{font-size:24px;font-weight:600}.label{font-size:19px}.small{font-size:16px}.node{fill:#fff;stroke:#456c60;stroke-width:2}.edge{fill:none;stroke:#536d66;stroke-width:2;marker-end:url(#arrow)}.axis{stroke:#aab4af;stroke-width:1.5}.curve{fill:none;stroke-width:3}</style><text x="40" y="40" class="title">六权重网络：先前向，后反向，最后同步更新</text><circle cx="140" cy="140" r="35" class="node"/><text x="140" y="147" text-anchor="middle" class="title">x₁</text><circle cx="140" cy="300" r="35" class="node"/><text x="140" y="307" text-anchor="middle" class="title">x₂</text><circle cx="455" cy="140" r="35" class="node"/><text x="455" y="147" text-anchor="middle" class="title">h₁</text><circle cx="455" cy="300" r="35" class="node"/><text x="455" y="307" text-anchor="middle" class="title">h₂</text><circle cx="775" cy="220" r="35" class="node"/><text x="775" y="227" text-anchor="middle" class="title">ŷ</text><path d="M176.0 140.0 L417.0 140.0" class="edge"/><text x="290" y="125" class="label">w₁</text><path d="M172.1 283.7 L421.1 157.2" class="edge"/><text x="230" y="235" class="label">w₂</text><path d="M172.1 156.3 L421.1 282.8" class="edge"/><text x="230" y="174" class="label">w₃</text><path d="M176.0 300.0 L417.0 300.0" class="edge"/><text x="290" y="325" class="label">w₄</text><path d="M489.9 148.7 L738.1 210.8" class="edge"/><text x="615" y="155" class="label">w₅</text><path d="M489.9 291.3 L738.1 229.2" class="edge"/><text x="615" y="300" class="label">w₆</text><text x="110" y="375" class="small">输入</text><text x="402" y="375" class="small">线性隐藏值</text><text x="734" y="375" class="small">线性输出</text><text x="40" y="407" class="small">自绘，依据 W4 第19–25页。此例不含偏置与隐藏激活；箭头表示前向依赖。</text></svg>