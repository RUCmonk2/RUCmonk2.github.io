<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">GRU：先重置候选，再按比例混合</title><desc id="desc">本课程采用“z控制新候选写入比例”的约定；各门由 [x<tspan baseline-shift="sub" font-size="70%">t</tspan>, h<tspan baseline-shift="sub" font-size="70%">t−1</tspan>] 计算</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#264c53"/></marker></defs><rect width="1000" height="620" rx="12" fill="#faf7ef"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="38" y="45" text-anchor="start" fill="#264c53" font-size="30" font-weight="600">GRU：先重置候选，再按比例混合</text><text x="38" y="80" text-anchor="start" fill="#5f6c6a" font-size="18" font-weight="400">本课程采用“z控制新候选写入比例”的约定；各门由 [x<tspan baseline-shift="sub" font-size="70%">t</tspan>, h<tspan baseline-shift="sub" font-size="70%">t−1</tspan>] 计算</text><rect x="25" y="135" width="140" height="65" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="95.0" y="175.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">h<tspan baseline-shift="sub" font-size="70%">t−1</tspan></text><path d="M165,167 L495,167" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="525" cy="167" r="24" fill="#faf7ef" stroke="#a15d38" stroke-width="2.5"/><text x="525" y="175" text-anchor="middle" fill="#a15d38" font-size="27" font-weight="400">×</text><path d="M550,167 L810,167" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="840" cy="167" r="24" fill="#faf7ef" stroke="#a15d38" stroke-width="2.5"/><text x="840" y="175" text-anchor="middle" fill="#a15d38" font-size="27" font-weight="400">+</text><path d="M865,167 L905,167" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><text x="940" y="177" text-anchor="middle" fill="#264c53" font-size="28" font-weight="400">h<tspan baseline-shift="sub" font-size="70%">t</tspan></text><rect x="470" y="240" width="110" height="55" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="525.0" y="275.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">1 − z<tspan baseline-shift="sub" font-size="70%">t</tspan></text><path d="M525,240 L525,196" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M200,167 L200,360 L255,360" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="285" cy="360" r="24" fill="#faf7ef" stroke="#a15d38" stroke-width="2.5"/><text x="285" y="368" text-anchor="middle" fill="#a15d38" font-size="27" font-weight="400">×</text><rect x="235" y="450" width="100" height="50" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="285.0" y="483.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">r<tspan baseline-shift="sub" font-size="70%">t</tspan></text><path d="M285,450 L285,389" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M310,360 L375,360" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="390" y="315" width="230" height="95" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="505.0" y="370.5" text-anchor="middle" fill="#264c53" font-size="20" font-weight="400">U<tspan baseline-shift="sub" font-size="70%">h</tspan> → 加 W<tspan baseline-shift="sub" font-size="70%">h</tspan>x<tspan baseline-shift="sub" font-size="70%">t</tspan>+b<tspan baseline-shift="sub" font-size="70%">h</tspan></text><path d="M620,360 L660,360" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="675" y="330" width="105" height="60" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="727.5" y="368.0" text-anchor="middle" fill="#264c53" font-size="22" font-weight="400">tanh</text><path d="M780,360 L815,360" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="840" cy="360" r="24" fill="#faf7ef" stroke="#a15d38" stroke-width="2.5"/><text x="840" y="368" text-anchor="middle" fill="#a15d38" font-size="27" font-weight="400">×</text><path d="M840,335 L840,195" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="800" y="450" width="100" height="50" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="850.0" y="483.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">z<tspan baseline-shift="sub" font-size="70%">t</tspan></text><path d="M850,450 L842,389" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><text x="500" y="548" text-anchor="middle" fill="#a15d38" font-size="27" font-weight="400">h<tspan baseline-shift="sub" font-size="70%">t</tspan> = (1 − z<tspan baseline-shift="sub" font-size="70%">t</tspan>) ⊙ h<tspan baseline-shift="sub" font-size="70%">t−1</tspan> + z<tspan baseline-shift="sub" font-size="70%">t</tspan> ⊙ h̃<tspan baseline-shift="sub" font-size="70%">t</tspan></text><text x="500" y="585" text-anchor="middle" fill="#5f6c6a" font-size="21" font-weight="400">重置门在 U<tspan baseline-shift="sub" font-size="70%">h</tspan> 之前；z 越大，新候选写入越多</text></g></svg>