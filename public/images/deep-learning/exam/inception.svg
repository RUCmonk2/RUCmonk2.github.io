<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc"><title id="title">Inception：并行提取，再按通道拼接</title><desc id="desc">1×1降维可减少后续大核卷积的权重数；示意不固定各分支通道数</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#264c53"/></marker></defs><rect width="1000" height="510" rx="12" fill="#faf7ef"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="38" y="45" text-anchor="start" fill="#264c53" font-size="30" font-weight="600">Inception：并行提取，再按通道拼接</text><text x="38" y="80" text-anchor="start" fill="#5f6c6a" font-size="18" font-weight="400">1×1降维可减少后续大核卷积的权重数；示意不固定各分支通道数</text><rect x="30" y="215" width="130" height="65" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="95.0" y="255.5" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">输入</text><path d="M160,247 L210,247" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M210,247 L210,143 L270,143" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="280" y="115" width="190" height="56" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="375.0" y="151.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">1×1卷积</text><path d="M470,143 L780,143 L780,247" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M210,247 L210,228 L270,228" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="280" y="200" width="190" height="56" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="375.0" y="236.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">1×1降维</text><path d="M470,228 L525,228" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="535" y="200" width="190" height="56" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="630.0" y="236.0" text-a