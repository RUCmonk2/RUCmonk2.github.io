<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Sigmoid自动微分计算图</title><desc id="desc">从w和x相乘，加b，取负，指数，加1，到倒数；反向箭头由输出指向输入。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536d66"/></marker></defs><rect width="960" height="420" rx="14" fill="#faf8f2"/><style>text{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;fill:#263e37}.title{font-size:24px;font-weight:600}.label{font-size:19px}.small{font-size:16px}.node{fill:#fff;stroke:#456c60;stroke-width:2}.edge{fill:none;stroke:#536d66;stroke-width:2;marker-end:url(#arrow)}.axis{stroke:#aab4af;stroke-width:1.5}.curve{fill:none;stroke-width:3}</style><text x="35" y="40" class="title">Sigmoid 计算图：反向时逐节点求局部导数</text><rect x="141" y="177" width="118" height="66" rx="10" class="node"/><text x="200" y="217" text-anchor="middle" class="small">u = w·x</text><path d="M259 210 L273 210" class="edge"/><rect x="276" y="177" width="118" height="66" rx="10" class="node"/><text x="335" y="217" text-anchor="middle" class="small">v = u+b</text><path d="M394 210 L408 210" class="edge"/><rect x="411" y="177" width="118" height="66" rx="10" class="node"/><text x="470" y="217" text-anchor="middle" class="small">r = −v</text><path d="M529 210 L543 210" class="edge"/><rect x="546" y="177" width="118" height="66" rx="10" class="node"/><text x="605" y="217" text-anchor="middle" class="small">s = exp(r)</text><path d="M664 210 L678 210" class="edge"/><rect x="681" y="177" width="118" height="66" rx="10" class="node"/><text x="740" y="217" text-anchor="middle" class="small">t = 1+s</text><path d="M799 210 L813 210" class="edge"/><rect x="816" y="177" width="118" height="66" rx="10" class="node"/><text x="875" y="217" text-anchor="middle" class="small">f = 1/t</text><text x="42" y="148" class="label">w</text><text x="42" y="283" class="label">x</text><path d="M65 142 L142 192" class="edge"/><path d="M65 276 L142 228" class="edge"/><text x="330" y="110" class="label">b</text><path d="M335 122 L335 173" class="edge"/><path d="M875 294 L200 294" fill="none" stroke="#b05e3e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="432" y="328" class="label">反向顺序</text><text x="35" y="383" class="small">前向缓存各节点值；反向从 ∂f/∂f = 1 开始。注意取负与倒数两个局部负号。</text><text x="35" y="408" class="small">自绘，依据 W3 第71–73页、W4 第33–36页；图中不展示题目数值答案。</text></svg>