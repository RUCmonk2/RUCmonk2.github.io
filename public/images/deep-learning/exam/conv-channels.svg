<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">多通道卷积：通道内计算，通道间相加</title><desc id="desc">输出通道之间使用不同参数；1×1卷积仍然混合全部输入通道</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#264c53"/></marker></defs><rect width="1000" height="480" rx="12" fill="#faf7ef"/><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><text x="38" y="45" text-anchor="start" fill="#264c53" font-size="30" font-weight="600">多通道卷积：通道内计算，通道间相加</text><text x="38" y="80" text-anchor="start" fill="#5f6c6a" font-size="18" font-weight="400">输出通道之间使用不同参数；1×1卷积仍然混合全部输入通道</text><rect x="45" y="130" width="175" height="60" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="132.5" y="168.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">输入通道 1</text><path d="M220,160 L320,160" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="330" y="130" width="180" height="60" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="420.0" y="168.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">核片 Kₒ,1</text><path d="M510,160 L590,160 L630,250" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="45" y="220" width="175" height="60" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="132.5" y="258.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">输入通道 2</text><path d="M220,250 L320,250" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="330" y="220" width="180" height="60" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="420.0" y="258.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">核片 Kₒ,2</text><path d="M510,250 L590,250 L630,250" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="45" y="310" width="175" height="60" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="132.5" y="348.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">输入通道 3</text><path d="M220,340 L320,340" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="330" y="310" width="180" height="60" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="420.0" y="348.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">核片 Kₒ,3</text><path d="M510,340 L590,340 L630,250" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><circle cx="655" cy="250" r="24" fill="#faf7ef" stroke="#a15d38" stroke-width="2.5"/><text x="655" y="258" text-anchor="middle" fill="#a15d38" font-size="27" font-weight="400">Σ</text><path d="M680,250 L745,250" fill="none" stroke="#264c53" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="755" y="215" width="200" height="70" rx="10" fill="#e8efeb" stroke="#bdccc5"/><text x="855.0" y="258.0" text-anchor="middle" fill="#264c53" font-size="24" font-weight="400">输出通道 o</text><text x="500" y="450" text-anchor="middle" fill="#a15d38" font-size="23" font-weight="400">每个输出通道：Cin 张核片 + 1 个偏置；共有 Cout 组</text></g></svg>