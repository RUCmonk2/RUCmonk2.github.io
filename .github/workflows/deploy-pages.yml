name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up font coverage validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font inspection dependency
        run: python -m pip install fonttools==4.62.1
      - name: Lint source
        run: npm run lint
      - name: Test publication rules
        run: npm run test:content
      - name: Validate mathematics map
        run: npm run test:math-map
      - name: Validate rotation workshop
        run: npm run test:rotations
      - name: Validate group theory workshop
        run: npm run test:galois
      - name: Validate K12 lessons and factor workshop
        run: npm run test:k12
      - name: Build static site
        run: npm run build
      - name: Check exported pages and links
        run: npm run check:export
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
